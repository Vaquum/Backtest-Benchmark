[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "backtest-benchmark"
version = "0.1.0"
description = "Code-evidenced backtesting comparisons with semantic gates and reproducible measurements"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=20,<27", "threadpoolctl>=3.6,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["bench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
