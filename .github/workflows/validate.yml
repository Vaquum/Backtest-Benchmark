name: Validate evidence and replay contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evidence-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      POLARS_MAX_THREADS: '1'
      PYTHONHASHSEED: '0'
      BENCH_TEST_FIXTURE: .work/data/recorded_spot_1h_2024.parquet
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install fixed runner dependencies
        run: |
          python -m pip install uv==0.12.23
          uv venv --python python .venv
          uv pip install --python .venv/bin/python --require-hashes -r locks/runner.txt
          uv pip install --python .venv/bin/python --no-deps --no-build-isolation -e .
      - name: Fetch exact inspected sources and recorded input
        run: |
          .venv/bin/python scripts/fetch_sources.py --include-auxiliary
          .venv/bin/python scripts/download_data.py
      - name: Validate the complete code-evidence matrix and recorded campaign
        run: |
          .venv/bin/python scripts/validate_assessment.py --sources .work/sources --campaign results/campaigns/2026-10-19-common-zero-single-thread/report.json --require-native-thread-policy
      - name: Check harness controls on the admitted recorded fixture
        run: .venv/bin/python -m pytest -q --basetemp=.work/pytest
      - name: Build Limen from pinned source and verify a fresh replay
        run: |
          .venv/bin/python scripts/bootstrap_core.py --engines limen --cc cc --cxx c++ --jobs 1
          .venv/bin/python -m bench verify --input .work/data/recorded_spot_1h_2024.parquet --expected-sha256 a634bbd4f3692fac7bc88512da588e7772f4bd1b749567606d5314e54d0adf72 --output .work/ci-limen --engines limen --strategies buy_and_hold sma_cross flat --rows 999
      - name: Check deterministic report generation
        run: |
          .venv/bin/python scripts/render_report.py
          git diff --exit-code -- reports/
